<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <title>Box Model - Exemplol</title>
        <style> 
            .box {
                color: white;
                background-color: blue;
                border: 4px solid red;
                padding: 25px 10px 20px 20px;  /* top-right-bottom-left  */
                width:200px;
                }
        </style>
    </head>
    <body>
        <div class="box">
            Este é o conteúdo da nossa caixa de exemplo. Temos apenas algum texto. 
            Não declaramos tamanho para a caixa, então ela vai preencher o espaço
            de acordo com o que a tela permitir.
        </div>
    </body>
</html>
